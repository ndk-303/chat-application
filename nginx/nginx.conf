worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # Docker embedded DNS — re-resolve khi scale backend lên/xuống
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ── Backend upstream ──────────────────────────────────────────────────────
    # least_conn: phân phối request đến replica ít connection nhất.
    # Phù hợp cho REST/API. Socket.IO đã stateless nhờ Redis Adapter nên
    # KHÔNG cần ip_hash — mọi replica đều relay events qua Redis pub/sub.
    upstream backend_pool {
        least_conn;
        server backend:5051;
        keepalive 64;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50m;

        location /api/ {
            proxy_pass http://backend_pool;

            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout    60s;
            proxy_connect_timeout 5s;
        }

        location /socket.io/ {
            proxy_pass http://backend_pool;

            proxy_http_version 1.1;

            # WebSocket upgrade — required for socket.io websocket transport
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host             $host;
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;

            # Disable buffering — critical for real-time WebSocket frames
            proxy_buffering    off;
            proxy_cache        off;

            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
        }

        location / {
            proxy_pass http://frontend;

            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host       $host;

            proxy_read_timeout 3600s;
        }
    }
}