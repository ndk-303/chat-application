worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
}

http {
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # ── Backend upstream ──────────────────────────────────────────────────────
    # Docker Compose's embedded DNS (127.0.0.11) resolves "backend" to ALL
    # replica IPs when you run: docker compose up --scale backend=N
    # ip_hash ensures a client's polling handshake always reaches the same
    # replica during Socket.IO connection setup.
    upstream backend_pool {
        ip_hash;
        server backend:5051;
        keepalive 32;
    }

    upstream frontend_pool {
        server frontend:80;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 50m;

        location /api/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location /socket.io/ {
            proxy_pass         http://backend_pool;
            proxy_http_version 1.1;

            # Must-have headers for WebSocket upgrade
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;

            proxy_read_timeout    3600s;
            proxy_send_timeout    3600s;
            proxy_connect_timeout 10s;
        }

        location / {
            proxy_pass         http://frontend_pool;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_read_timeout 3600s;
        }
    }
}
