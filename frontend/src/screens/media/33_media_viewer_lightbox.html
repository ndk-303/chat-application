<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aether Chat - Media Viewer Modal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#00A67E',
              hover: '#008f6c',
              dim: 'rgba(0, 166, 126, 0.12)',
              glow: 'rgba(0, 166, 126, 0.25)'
            },
            canvas: '#0D0F12',
            surface: '#16191E',
            'surface-bright': '#1E222A',
            border: '#23272F',
            'border-subtle': 'rgba(255, 255, 255, 0.07)',
            'text-primary': '#F3F4F6',
            'text-secondary': '#9CA3AF',
            'text-tertiary': '#6B7280'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
      vertical-align: middle;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 4px;
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #23272F;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-canvas text-text-primary font-sans antialiased h-screen w-screen overflow-hidden select-none">

  <!-- Background Dimmed Context: Underlying Aether Chat app (subtly visible beneath blur) -->
  <div class="absolute inset-0 z-0 flex pointer-events-none opacity-40 filter blur-[3px]">
    <!-- Simulated Left Nav -->
    <div class="w-16 h-full bg-[#111317] border-r border-[#23272F] flex flex-col items-center py-5 gap-6">
      <div class="w-9 h-9 rounded-xl bg-[#00A67E]/20 text-[#00A67E] flex items-center justify-center font-bold font-mono">Æ</div>
      <div class="w-8 h-8 rounded-lg bg-[#1E222A] text-text-secondary flex items-center justify-center">
        <span class="material-symbols-outlined text-[18px]">chat_bubble</span>
      </div>
      <div class="w-8 h-8 rounded-lg text-text-tertiary flex items-center justify-center">
        <span class="material-symbols-outlined text-[18px]">call</span>
      </div>
      <div class="w-8 h-8 rounded-lg text-text-tertiary flex items-center justify-center">
        <span class="material-symbols-outlined text-[18px]">group</span>
      </div>
    </div>
    <!-- Simulated Chat Column -->
    <div class="w-80 h-full bg-[#14171D] border-r border-[#23272F] p-4 flex flex-col gap-3">
      <div class="h-9 rounded-lg bg-[#1A1E24] border border-[#23272F]"></div>
      <div class="h-16 rounded-xl bg-[#1A1E24]/60"></div>
      <div class="h-16 rounded-xl bg-[#1E222A]"></div>
      <div class="h-16 rounded-xl bg-[#1A1E24]/60"></div>
    </div>
    <!-- Simulated Main Chat Area -->
    <div class="flex-1 h-full bg-[#0D0F12] p-8 flex flex-col justify-end gap-4">
      <div class="w-2/3 h-24 rounded-2xl bg-[#16191E] border border-[#23272F]"></div>
      <div class="w-1/2 h-32 rounded-2xl bg-[#00A67E]/10 border border-[#00A67E]/30 self-end"></div>
      <div class="w-3/4 h-20 rounded-2xl bg-[#16191E] border border-[#23272F]"></div>
    </div>
  </div>

  <!-- Lightbox Backdrop with subtle backdrop-blur-md -->
  <div class="absolute inset-0 z-10 bg-[#0D0F12]/92 backdrop-blur-md flex flex-col justify-between overflow-hidden">

    <!-- ==================== TOP FLOATING BAR ==================== -->
    <header class="w-full px-6 pt-5 pb-3 z-30 flex items-center justify-between pointer-events-auto">
      <!-- Left: File Metadata & Name -->
      <div class="flex items-center gap-3 bg-surface/90 border border-border px-3.5 py-2 rounded-xl backdrop-blur-md shadow-2xl shadow-black/40">
        <div class="w-7 h-7 rounded-lg bg-brand-dim text-brand flex items-center justify-center">
          <span class="material-symbols-outlined text-[17px]">image</span>
        </div>
        <div class="flex items-center gap-2.5">
          <span class="font-semibold text-[13.5px] text-text-primary tracking-tight">system_topology_v4.png</span>
          <div class="h-3.5 w-px bg-border"></div>
          <span class="font-mono text-[11.5px] px-2 py-0.5 rounded bg-black/40 border border-border-subtle text-text-secondary font-medium">4.2 MB</span>
          <span class="font-mono text-[11.5px] text-text-tertiary">3840 × 2160 px</span>
        </div>
      </div>

      <!-- Center: Sender Details & Timestamp -->
      <div class="flex items-center gap-2.5 bg-surface/90 border border-border px-3.5 py-2 rounded-xl backdrop-blur-md shadow-2xl shadow-black/40">
        <div class="relative">
          <div class="w-6 h-6 rounded-full bg-emerald-950 border border-brand/40 text-brand text-[10px] font-semibold flex items-center justify-center">
            ER
          </div>
          <span class="absolute -bottom-0.5 -right-0.5 w-2 h-2 rounded-full bg-brand ring-2 ring-surface"></span>
        </div>
        <div class="text-[13px] flex items-center gap-1.5">
          <span class="font-medium text-text-primary">Elena Rostova</span>
          <span class="text-text-tertiary text-[11px]">•</span>
          <span class="text-text-secondary text-[12px]">Yesterday at 16:42</span>
        </div>
        <div class="h-3.5 w-px bg-border mx-0.5"></div>
        <span class="font-mono text-[10.5px] text-brand bg-brand-dim px-1.5 py-0.5 rounded border border-brand/20 flex items-center gap-1">
          <span class="material-symbols-outlined text-[12px]">verified</span>
          E2EE Verified
        </span>
      </div>

      <!-- Right: Zoom & Window Controls -->
      <div class="flex items-center gap-2.5">
        <!-- Zoom Controls Pill -->
        <div class="flex items-center bg-surface/90 border border-border p-1 rounded-xl backdrop-blur-md shadow-2xl shadow-black/40">
          <button title="Zoom Out (Cmd -)" class="w-7 h-7 rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface-bright flex items-center justify-center transition-colors">
            <span class="material-symbols-outlined text-[16px]">remove</span>
          </button>
          <div class="px-2 font-mono text-[11.5px] text-text-primary font-medium select-none">100%</div>
          <button title="Zoom In (Cmd +)" class="w-7 h-7 rounded-lg text-text-secondary hover:text-text-primary hover:bg-surface-bright flex items-center justify-center transition-colors">
            <span class="material-symbols-outlined text-[16px]">add</span>
          </button>
          <div class="h-4 w-px bg-border mx-1"></div>
          <button title="Fit to viewport" class="px-2.5 py-1 rounded-lg text-[12px] font-medium text-text-secondary hover:text-text-primary hover:bg-surface-bright flex items-center gap-1.5 transition-colors">
            <span class="material-symbols-outlined text-[15px]">fit_screen</span>
            <span>Fit to screen</span>
          </button>
          <button title="Original 1:1" class="px-2 py-1 rounded-lg text-[12px] font-medium text-text-tertiary hover:text-text-primary hover:bg-surface-bright transition-colors">
            1:1
          </button>
        </div>

        <!-- Close / Escape Button -->
        <button title="Close (Esc)" class="flex items-center gap-1.5 bg-surface/90 hover:bg-surface-bright border border-border text-text-secondary hover:text-text-primary px-3 py-2 rounded-xl backdrop-blur-md shadow-2xl shadow-black/40 transition-all active:scale-95 group">
          <span class="text-[12px] font-medium">Close</span>
          <kbd class="font-mono text-[10.5px] text-text-tertiary group-hover:text-text-secondary bg-black/40 border border-border-subtle px-1.5 py-0.5 rounded">Esc</kbd>
          <span class="material-symbols-outlined text-[17px] ml-0.5 text-text-secondary group-hover:text-text-primary">close</span>
        </button>
      </div>
    </header>

    <!-- ==================== CENTER STAGE & CANVAS ==================== -->
    <main class="relative flex-1 w-full flex items-center justify-center overflow-hidden px-14 my-1">
      <!-- Previous Navigation Chevron -->
      <button class="absolute left-6 z-20 w-11 h-11 rounded-full bg-surface/85 hover:bg-surface-bright border border-border hover:border-brand/40 text-text-secondary hover:text-text-primary flex items-center justify-center shadow-2xl shadow-black/50 transition-all active:scale-95 group" title="Previous Media (Left Arrow)">
        <span class="material-symbols-outlined text-[22px] group-hover:-translate-x-0.5 transition-transform">chevron_left</span>
      </button>

      <!-- Next Navigation Chevron -->
      <button class="absolute right-6 z-20 w-11 h-11 rounded-full bg-surface/85 hover:bg-surface-bright border border-border hover:border-brand/40 text-text-secondary hover:text-text-primary flex items-center justify-center shadow-2xl shadow-black/50 transition-all active:scale-95 group" title="Next Media (Right Arrow)">
        <span class="material-symbols-outlined text-[22px] group-hover:translate-x-0.5 transition-transform">chevron_right</span>
      </button>

      <!-- Image Preview Container / Center Schematic -->
      <div class="relative max-w-5xl max-h-[64vh] w-full h-full flex items-center justify-center">
        <!-- Card Frame with subtle ambient glow -->
        <div class="relative w-full h-full max-h-[62vh] rounded-2xl bg-[#12141A] border border-border shadow-[0_20px_60px_rgba(0,0,0,0.7)] flex flex-col overflow-hidden">
          
          <!-- Inner Mini Header / Inspector Strip -->
          <div class="h-9 px-4 bg-[#16191E] border-b border-border/80 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-[#EF4444]/60"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-[#F59E0B]/60"></span>
              <span class="w-2.5 h-2.5 rounded-full bg-[#10B981]/60"></span>
              <span class="ml-2 font-mono text-[11px] text-text-tertiary">aether-webrtc-core // mesh_topology_orchestration.svg</span>
            </div>
            <div class="flex items-center gap-3">
              <span class="font-mono text-[10.5px] text-brand flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-brand animate-pulse"></span>
                LOSSLESS VECTOR RENDER
              </span>
              <span class="text-text-tertiary text-[11px] font-mono">RGBA · 8-bit</span>
            </div>
          </div>

          <!-- SVG Architectural Schematic Diagram Rendered Crisp -->
          <div class="relative flex-1 bg-[#0c0e12] flex items-center justify-center p-6 overflow-hidden">
            <!-- Subtle Grid Background -->
            <div class="absolute inset-0 bg-[radial-gradient(#23272f_1px,transparent_1px)] [background-size:20px_20px] opacity-40"></div>
            
            <svg class="w-full h-full max-h-[50vh] relative z-10" viewBox="0 0 1000 480" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="lineGradA" x1="180" y1="240" x2="500" y2="130" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#00A67E" stop-opacity="0.8"/>
                  <stop offset="1" stop-color="#00A67E" stop-opacity="0.3"/>
                </linearGradient>
                <linearGradient id="lineGradB" x1="180" y1="240" x2="500" y2="350" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#00A67E" stop-opacity="0.8"/>
                  <stop offset="1" stop-color="#3B82F6" stop-opacity="0.3"/>
                </linearGradient>
                <linearGradient id="lineGradC" x1="500" y1="130" x2="820" y2="240" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#00A67E" stop-opacity="0.4"/>
                  <stop offset="1" stop-color="#00A67E" stop-opacity="0.9"/>
                </linearGradient>
                <linearGradient id="lineGradD" x1="500" y1="350" x2="820" y2="240" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#3B82F6" stop-opacity="0.4"/>
                  <stop offset="1" stop-color="#00A67E" stop-opacity="0.9"/>
                </linearGradient>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="6" result="blur" />
                  <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
              </defs>

              <!-- Connecting Data Paths -->
              <path d="M 180 240 L 500 130" stroke="url(#lineGradA)" stroke-width="2" stroke-dasharray="5 5" />
              <path d="M 180 240 L 500 350" stroke="url(#lineGradB)" stroke-width="2" />
              <path d="M 500 130 L 820 240" stroke="url(#lineGradC)" stroke-width="2" />
              <path d="M 500 350 L 820 240" stroke="url(#lineGradD)" stroke-width="2" stroke-dasharray="5 5" />
              <path d="M 500 130 L 500 350" stroke="#23272F" stroke-width="2" stroke-dasharray="3 3" />
              
              <!-- Direct Peer Mesh Handshake Arc -->
              <path d="M 180 240 C 340 60, 660 60, 820 240" stroke="#00A67E" stroke-width="1.75" opacity="0.4" stroke-dasharray="6 4" />
              <path d="M 180 240 C 340 420, 660 420, 820 240" stroke="#23272F" stroke-width="1.5" stroke-dasharray="4 4" />

              <!-- Midpoint Status Tags -->
              <rect x="440" y="32" width="120" height="24" rx="12" fill="#16191E" stroke="#00A67E" stroke-width="1" />
              <text x="500" y="48" fill="#00A67E" font-size="10" font-family="JetBrains Mono" font-weight="600" text-anchor="middle">DTLS 1.3 / SRTP</text>

              <rect x="420" y="420" width="160" height="24" rx="12" fill="#16191E" stroke="#23272F" stroke-width="1" />
              <text x="500" y="436" fill="#9CA3AF" font-size="10" font-family="JetBrains Mono" text-anchor="middle">FALLBACK STUN/TURN RELAY</text>

              <!-- Node A: Client Initiator -->
              <g transform="translate(180, 240)">
                <circle r="44" fill="#16191E" stroke="#00A67E" stroke-width="2" filter="url(#glow)"/>
                <circle r="36" fill="#1A1F26" stroke="#23272F" stroke-width="1"/>
                <circle r="6" fill="#00A67E"/>
                <text y="-56" fill="#F3F4F6" font-size="13" font-family="Inter" font-weight="600" text-anchor="middle">Node A (Initiator)</text>
                <text y="-40" fill="#9CA3AF" font-size="10" font-family="JetBrains Mono" text-anchor="middle">0x82f4 · Alex Rivera</text>
                <text y="58" fill="#6B7280" font-size="10.5" font-family="JetBrains Mono" text-anchor="middle">192.0.2.45:48291</text>
              </g>

              <!-- Central Node Top: WebRTC Signaling Mesh -->
              <g transform="translate(500, 130)">
                <rect x="-70" y="-32" width="140" height="64" rx="12" fill="#16191E" stroke="#23272F" stroke-width="1.5"/>
                <circle cx="-46" cy="0" r="4" fill="#00A67E"/>
                <text x="-32" y="-5" fill="#F3F4F6" font-size="12" font-family="Inter" font-weight="600">Aether Relay</text>
                <text x="-32" y="12" fill="#00A67E" font-size="9.5" font-family="JetBrains Mono">us-east-mesh-04</text>
                <text y="48" fill="#9CA3AF" font-size="10" font-family="JetBrains Mono" text-anchor="middle">RTT: 12ms · 0% loss</text>
              </g>

              <!-- Central Node Bottom: STUN/TURN Discovery -->
              <g transform="translate(500, 350)">
                <rect x="-70" y="-32" width="140" height="64" rx="12" fill="#16191E" stroke="#23272F" stroke-width="1.5"/>
                <circle cx="-46" cy="0" r="4" fill="#3B82F6"/>
                <text x="-32" y="-5" fill="#F3F4F6" font-size="12" font-family="Inter" font-weight="600">ICE Negotiator</text>
                <text x="-32" y="12" fill="#3B82F6" font-size="9.5" font-family="JetBrains Mono">RFC-8445 Compliant</text>
                <text y="48" fill="#9CA3AF" font-size="10" font-family="JetBrains Mono" text-anchor="middle">Host Candidate Pairs</text>
              </g>

              <!-- Node B: Receiver Peer -->
              <g transform="translate(820, 240)">
                <circle r="44" fill="#16191E" stroke="#00A67E" stroke-width="2" filter="url(#glow)"/>
                <circle r="36" fill="#1A1F26" stroke="#23272F" stroke-width="1"/>
                <circle r="6" fill="#00A67E"/>
                <text y="-56" fill="#F3F4F6" font-size="13" font-family="Inter" font-weight="600" text-anchor="middle">Node B (Peer)</text>
                <text y="-40" fill="#9CA3AF" font-size="10" font-family="JetBrains Mono" text-anchor="middle">0x9f4a · Elena Rostova</text>
                <text y="58" fill="#6B7280" font-size="10.5" font-family="JetBrains Mono" text-anchor="middle">198.51.100.22:50442</text>
              </g>
            </svg>

            <!-- Bottom Floating Quick Overlay Badge on Image -->
            <div class="absolute bottom-4 right-4 bg-surface/90 border border-border px-3 py-1.5 rounded-lg backdrop-blur-md flex items-center gap-2">
              <span class="material-symbols-outlined text-brand text-[15px]">security</span>
              <span class="font-mono text-[11px] text-text-secondary">Double Ratchet Session Key: <span class="text-text-primary">7f8a..b4c2</span></span>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- ==================== BOTTOM FLOATING BAR ==================== -->
    <footer class="w-full px-6 pb-5 pt-3 z-30 flex items-center justify-between pointer-events-auto">
      <!-- Left: Thumbnail Gallery Strip (5 items, active item highlighted with 2px emerald border) -->
      <div class="flex items-center gap-2 bg-surface/90 border border-border p-2 rounded-2xl backdrop-blur-md shadow-2xl shadow-black/40">
        <!-- Thumbnail 1 (Older) -->
        <button class="relative w-14 h-11 rounded-lg overflow-hidden border border-border bg-[#101216] hover:border-text-secondary/50 transition-all flex items-center justify-center group shrink-0" title="ice_handshake_flow.png">
          <div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-[#181B22] to-[#0E1014] p-1">
            <span class="material-symbols-outlined text-[16px] text-text-tertiary group-hover:text-text-secondary">schema</span>
            <span class="font-mono text-[8px] text-text-tertiary mt-0.5">flow.png</span>
          </div>
        </button>

        <!-- Thumbnail 2 (Previous) -->
        <button class="relative w-14 h-11 rounded-lg overflow-hidden border border-border bg-[#101216] hover:border-text-secondary/50 transition-all flex items-center justify-center group shrink-0" title="webrtc_benchmark_graph.png">
          <div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-[#181B22] to-[#0E1014] p-1">
            <span class="material-symbols-outlined text-[16px] text-text-tertiary group-hover:text-text-secondary">show_chart</span>
            <span class="font-mono text-[8px] text-text-tertiary mt-0.5">bench.png</span>
          </div>
        </button>

        <!-- Thumbnail 3: ACTIVE ITEM (system_topology_v4.png) -->
        <div class="relative w-16 h-12 rounded-lg overflow-hidden border-2 border-brand bg-[#161B22] shadow-[0_0_14px_rgba(0,166,126,0.35)] shrink-0 ring-1 ring-brand/50">
          <div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-[#192320] to-[#111618] p-1">
            <span class="material-symbols-outlined text-[17px] text-brand">hub</span>
            <span class="font-mono text-[8.5px] font-semibold text-text-primary tracking-tight">v4.png</span>
          </div>
          <div class="absolute top-1 right-1 w-1.5 h-1.5 rounded-full bg-brand"></div>
        </div>

        <!-- Thumbnail 4 (Next - Video Preview) -->
        <button class="relative w-14 h-11 rounded-lg overflow-hidden border border-border bg-[#101216] hover:border-text-secondary/50 transition-all flex items-center justify-center group shrink-0" title="screen_recording_094.mp4">
          <div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-[#181B22] to-[#0E1014] p-1">
            <span class="material-symbols-outlined text-[16px] text-text-tertiary group-hover:text-text-secondary">play_circle</span>
            <span class="font-mono text-[8px] text-text-tertiary mt-0.5">rec.mp4</span>
          </div>
          <span class="absolute bottom-0.5 right-1 text-[7.5px] font-mono text-text-tertiary">0:42</span>
        </button>

        <!-- Thumbnail 5 (Future item) -->
        <button class="relative w-14 h-11 rounded-lg overflow-hidden border border-border bg-[#101216] hover:border-text-secondary/50 transition-all flex items-center justify-center group shrink-0" title="client_audit_log.png">
          <div class="w-full h-full flex flex-col items-center justify-center bg-gradient-to-br from-[#181B22] to-[#0E1014] p-1">
            <span class="material-symbols-outlined text-[16px] text-text-tertiary group-hover:text-text-secondary">description</span>
            <span class="font-mono text-[8px] text-text-tertiary mt-0.5">audit.png</span>
          </div>
        </button>
        
        <div class="h-6 w-px bg-border mx-1"></div>
        <div class="px-2 font-mono text-[11px] text-text-tertiary">
          <span class="text-text-primary font-medium">3</span> / 5
        </div>
      </div>

      <!-- Right: Action Buttons -->
      <div class="flex items-center gap-2.5 bg-surface/90 border border-border p-1.5 rounded-2xl backdrop-blur-md shadow-2xl shadow-black/40">
        <!-- Copy Image -->
        <button class="px-3.5 py-2 rounded-xl text-[13px] font-medium text-text-secondary hover:text-text-primary hover:bg-surface-bright flex items-center gap-2 transition-all active:scale-[0.98]">
          <span class="material-symbols-outlined text-[18px]">content_copy</span>
          <span>Copy Image</span>
        </button>

        <!-- Open in New Tab -->
        <button class="px-3.5 py-2 rounded-xl text-[13px] font-medium text-text-secondary hover:text-text-primary hover:bg-surface-bright flex items-center gap-2 transition-all active:scale-[0.98]">
          <span class="material-symbols-outlined text-[18px]">open_in_new</span>
          <span>Open in New Tab</span>
        </button>

        <div class="h-4 w-px bg-border mx-0.5"></div>

        <!-- Primary Download Button (Solid emerald #00A67E) -->
        <button class="bg-brand hover:bg-brand-hover active:scale-[0.98] text-white px-4 py-2 rounded-xl text-[13px] font-semibold flex items-center gap-2 shadow-lg shadow-brand/20 transition-all">
          <span class="material-symbols-outlined text-[18px]">download</span>
          <span>Download (4.2 MB)</span>
        </button>
      </div>
    </footer>

  </div>
</body>
</html>
