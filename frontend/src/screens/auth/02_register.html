<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create your account - Aether Chat</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "tertiary-fixed": "#e2e2e6",
            "on-error-container": "#ffdad6",
            "on-tertiary": "#2f3034",
            "error": "#EF4444",
            "surface-container-high": "#232a34",
            "on-primary-fixed-variant": "#00513c",
            "border": "#23272F",
            "tertiary": "#c6c6ca",
            "on-primary": "#003828",
            "surface-container-lowest": "#080f17",
            "surface-container-low": "#151c25",
            "surface-tint": "#5bdcb0",
            "on-tertiary-container": "#292b2e",
            "on-primary-container": "#003224",
            "on-secondary-fixed-variant": "#44474d",
            "secondary-container": "#44474d",
            "on-surface-variant": "#bccac2",
            "on-secondary-container": "#b3b5bc",
            "on-error": "#690005",
            "primary-container": "#00a67e",
            "surface-variant": "#2e353f",
            "on-secondary-fixed": "#191c21",
            "surface-container": "#192029",
            "surface-dim": "#0d141d",
            "text-primary": "#F3F4F6",
            "secondary": "#c4c6cd",
            "error-container": "#93000a",
            "on-background": "#dce3f0",
            "on-surface": "#dce3f0",
            "primary-fixed-dim": "#5bdcb0",
            "on-tertiary-fixed": "#1a1c1f",
            "text-secondary": "#9CA3AF",
            "inverse-on-surface": "#2a313b",
            "outline": "#86948c",
            "success": "#10B981",
            "secondary-fixed": "#e1e2e9",
            "primary-fixed": "#7af9cc",
            "outline-variant": "#3d4a43",
            "on-secondary": "#2e3036",
            "inverse-surface": "#dce3f0",
            "on-primary-fixed": "#002116",
            "surface-bright": "#333a44",
            "secondary-fixed-dim": "#c4c6cd",
            "primary": "#5bdcb0",
            "on-tertiary-fixed-variant": "#45474a",
            "tertiary-fixed-dim": "#c6c6ca",
            "inverse-primary": "#006c51",
            "surface-container-highest": "#2e353f",
            "surface": "#16191E",
            "tertiary-container": "#919296",
            "background": "#0D0F12"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "space-sm": "0.5rem",
            "space-lg": "1.5rem",
            "space-xl": "2rem",

          },
          "fontFamily": {
            "small": ["Inter"],
            "mono": ["JetBrains Mono"],

            "body-md": ["1rem", { "lineHeight": "1.6", "fontWeight": "400" }]

</head>
<body class="bg-background text-text-primary min-h-screen flex flex-col justify-between items-center py-12 px-4 selection:bg-primary-container selection:text-white antialiased font-body-md">
<!-- Header Branding Anchor -->
<header class="w-full flex justify-center items-center">
<div class="inline-flex items-center gap-2.5 px-3 py-1.5 rounded-full border border-border bg-surface shadow-sm">
<div class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></div>
<span class="font-h2 text-h2 text-text-primary tracking-tight font-semibold">Aether</span>
</div>
</header>
<!-- Centered Registration Card -->
<main class="w-full max-w-[440px] my-auto">
<div class="bg-surface border border-border rounded-xl p-8 shadow-[0_4px_24px_rgba(0,0,0,0.35)] transition-all">
<!-- Card Title & Subtitle -->
<div class="mb-6">
<h1 class="font-h2 text-h2 text-text-primary tracking-tight">Create your account</h1>
<p class="font-small text-small text-text-secondary mt-1.5">Start communicating privately and securely.</p>
</div>
<!-- Registration Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Full Name -->
<div class="space-y-1.5">
<label class="block font-mono text-[11px] tracking-wider text-text-secondary font-medium uppercase" for="name">
            FULL NAME
          </label>
<input autocomplete="name" class="w-full bg-background border border-border rounded-xl text-text-primary placeholder-[#6B7280] px-3.5 py-2.5 font-small text-small focus:ring-2 focus:ring-primary-container focus:border-transparent focus:outline-none transition-all duration-150 ease-out" id="name" name="name" placeholder="Alex Morgan" required="" type="text"/>
</div>
<!-- Email Address -->
<div class="space-y-1.5">
<label class="block font-mono text-[11px] tracking-wider text-text-secondary font-medium uppercase" for="email">
            EMAIL ADDRESS
          </label>
<input autocomplete="email" class="w-full bg-background border border-border rounded-xl text-text-primary placeholder-[#6B7280] px-3.5 py-2.5 font-small text-small focus:ring-2 focus:ring-primary-container focus:border-transparent focus:outline-none transition-all duration-150 ease-out" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
<!-- Password Field with Visibility Toggle & Strength Segment -->
<div class="space-y-1.5">
<label class="block font-mono text-[11px] tracking-wider text-text-secondary font-medium uppercase" for="password">
            PASSWORD
          </label>
<div class="relative flex items-center">
<input autocomplete="new-password" class="w-full bg-background border border-border rounded-xl text-text-primary placeholder-[#6B7280] pl-3.5 pr-10 py-2.5 font-small text-small focus:ring-2 focus:ring-primary-container focus:border-transparent focus:outline-none transition-all duration-150 ease-out" id="password" name="password" placeholder="At least 8 characters" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-text-secondary hover:text-text-primary transition-colors duration-150 focus:outline-none flex items-center justify-center p-1" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Segmented Password Strength Bar -->
<div class="pt-1.5">
<div class="grid grid-cols-4 gap-1.5 w-full">
<div class="h-1 rounded-full bg-primary-container"></div>
<div class="h-1 rounded-full bg-primary-container"></div>
<div class="h-1 rounded-full bg-primary-container"></div>
<div class="h-1 rounded-full bg-primary-container"></div>
</div>
<div class="flex justify-between items-center mt-1.5">
<span class="font-small text-xs font-medium text-success">Strong password</span>
<span class="font-mono text-[11px] text-text-secondary">E2EE Ready</span>
</div>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-1.5">
<label class="block font-mono text-[11px] tracking-wider text-text-secondary font-medium uppercase" for="confirm-password">
            CONFIRM PASSWORD
          </label>
<input autocomplete="new-password" class="w-full bg-background border border-border rounded-xl text-text-primary placeholder-[#6B7280] px-3.5 py-2.5 font-small text-small focus:ring-2 focus:ring-primary-container focus:border-transparent focus:outline-none transition-all duration-150 ease-out" id="confirm-password" name="confirm-password" placeholder="Repeat your password" required="" type="password"/>
</div>
<!-- Terms & Privacy Agreement Checkbox -->
<div class="pt-2 pb-1">
<label class="flex items-start gap-2.5 cursor-pointer select-none group">
<div class="relative flex items-center justify-center mt-0.5">
<input checked="" class="sr-only peer" id="terms" type="checkbox"/>
<div class="w-4 h-4 rounded bg-background border border-border peer-checked:bg-primary-container peer-checked:border-primary-container flex items-center justify-center text-white transition-all duration-150 group-hover:border-outline">
<svg class="w-3 h-3 text-white stroke-current fill-none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
</div>
<span class="font-small text-xs text-text-secondary leading-relaxed">
              I agree to the 
              <a class="text-text-primary underline hover:text-primary-container transition-colors duration-150 underline-offset-2" href="#">Terms of Service</a> 
              and 
              <a class="text-text-primary underline hover:text-primary-container transition-colors duration-150 underline-offset-2" href="#">Privacy Policy</a>
</span>
</label>
</div>
<!-- Primary CTA Submit Button -->
<div class="pt-2">
<button class="w-full py-2.5 px-4 bg-primary-container hover:brightness-105 active:brightness-95 text-white font-small text-small font-semibold rounded-xl transition-all duration-150 ease-out shadow-sm flex items-center justify-center gap-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-surface" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</form>
<!-- Bottom Alternative Action -->
<p class="font-small text-small text-text-secondary text-center mt-6">
        Already have an account? 
        <a class="text-primary-container hover:underline font-medium ml-1 transition-colors duration-150" href="#">Sign in</a>
</p>
</div>
</main>
<!-- Minimalist Clean Footer -->
<footer class="w-full text-center">
<p class="font-small text-xs text-text-secondary tracking-wide">
      Aether Secure Communication • Privacy &amp; Terms
    </p>
</footer>
<!-- Vanilla Interaction Logic for Password Reveal -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggle-password');
      const passwordInput = document.getElementById('password');
      const icon = toggleBtn.querySelector('span');

      toggleBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        icon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    });
  </script>
</body></html>
