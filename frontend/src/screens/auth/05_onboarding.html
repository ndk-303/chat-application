<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aether Chat — Profile Setup</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-highest": "#2e353f",
            "outline": "#86948c",
            "primary-fixed-dim": "#5bdcb0",
            "outline-variant": "#3d4a43",
            "text-primary": "#F3F4F6",
            "surface-container-high": "#232a34",
            "surface": "#16191E",
            "on-tertiary-container": "#292b2e",
            "secondary-fixed-dim": "#c4c6cd",
            "tertiary-container": "#919296",
            "secondary-fixed": "#e1e2e9",
            "on-secondary": "#2e3036",
            "tertiary-fixed": "#e2e2e6",
            "error-container": "#93000a",
            "on-error-container": "#ffdad6",
            "on-primary-fixed-variant": "#00513c",
            "on-tertiary": "#2f3034",
            "on-primary-container": "#003224",
            "on-error": "#690005",
            "primary-fixed": "#7af9cc",
            "primary-container": "#00a67e",
            "secondary-container": "#44474d",
            "error": "#EF4444",
            "primary": "#5bdcb0",
            "inverse-primary": "#006c51",
            "background": "#0D0F12",
            "surface-container-lowest": "#080f17",
            "tertiary": "#c6c6ca",
            "on-secondary-container": "#b3b5bc",
            "on-surface": "#dce3f0",
            "tertiary-fixed-dim": "#c6c6ca",
            "on-tertiary-fixed": "#1a1c1f",
            "on-surface-variant": "#bccac2",
            "surface-bright": "#333a44",
            "text-secondary": "#9CA3AF",
            "inverse-surface": "#dce3f0",
            "on-tertiary-fixed-variant": "#45474a",
            "surface-container": "#192029",
            "on-secondary-fixed-variant": "#44474d",
            "border": "#23272F",
            "on-primary": "#003828",
            "inverse-on-surface": "#2a313b",
            "surface-dim": "#0d141d",
            "on-secondary-fixed": "#191c21",
            "on-background": "#dce3f0",
            "success": "#10B981",
            "surface-container-low": "#151c25",
            "surface-tint": "#5bdcb0",
            "on-primary-fixed": "#002116",
            "surface-variant": "#2e353f",
            "secondary": "#c4c6cd"
          },
          borderRadius: {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          spacing: {
            "space-xl": "2rem",
            "space-sm": "0.5rem",
            "space-lg": "1.5rem",
            "margin": "2rem",
            "space-md": "1rem",
            "space-xs": "0.25rem",
            "gutter": "1.5rem"
          },
          fontFamily: {
            "body-md": ["Inter", "sans-serif"],
            "small": ["Inter", "sans-serif"],
            "h2": ["Inter", "sans-serif"],
            "mono": ["JetBrains Mono", "monospace"],
            "h1": ["Inter", "sans-serif"]
          },
          fontSize: {
            "body-md": ["1rem", { lineHeight: "1.6", fontWeight: "400" }],
            "small": ["0.875rem", { lineHeight: "1.5", fontWeight: "400" }],
            "h2": ["1.5rem", { lineHeight: "1.3", fontWeight: "600" }],
            "mono": ["0.875rem", { fontWeight: "500" }],
            "h1": ["2.25rem", { lineHeight: "1.25", fontWeight: "700" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background text-text-primary min-h-screen flex flex-col justify-between items-center py-12 px-4 selection:bg-primary-container/20 selection:text-text-primary antialiased font-body-md text-body-md">
<!-- Top Branding Header -->
<header class="w-full flex justify-center items-center">
<div class="rounded-full px-4 py-1.5 bg-surface border border-border flex items-center gap-2 shadow-sm transition-colors duration-150">
<span class="w-2 h-2 rounded-full bg-primary-container inline-block"></span>
<span class="font-body-md text-small text-text-primary font-medium tracking-tight">Aether</span>
</div>
</header>
<!-- Card Container -->
<main class="w-full max-w-[480px] my-auto">
<div class="bg-surface border border-border rounded-xl p-8 shadow-2xl relative">
<!-- Card Header -->
<div class="text-left">
<h1 class="font-h1 text-h2 text-text-primary font-bold tracking-tight">Set up your profile</h1>
<p class="text-text-secondary font-small text-small mt-1.5">Choose how you appear to contacts and colleagues.</p>
</div>
<!-- Avatar Upload Section -->
<div class="mt-6 pt-2 pb-1 flex items-center gap-4">
<!-- Avatar Preview / Initial Badge -->
<div class="relative w-[72px] h-[72px] rounded-full bg-background border border-border flex items-center justify-center text-text-primary font-semibold text-xl tracking-tight group cursor-pointer shrink-0">
<span class="select-none font-h2 text-h2">AM</span>
<div class="w-6 h-6 rounded-full bg-primary-container text-text-primary flex items-center justify-center absolute bottom-0 right-0 shadow ring-2 ring-surface hover:brightness-110 transition-all duration-150">
<span class="material-symbols-outlined text-[14px] text-text-primary" data-icon="photo_camera">photo_camera</span>
</div>
</div>
<!-- Avatar Controls -->
<div class="flex flex-col gap-1">
<div>
<button class="px-3 py-1.5 rounded-lg bg-border/60 hover:bg-border border border-border text-text-primary font-small text-small font-medium transition-colors duration-150 flex items-center gap-1.5" type="button">
<span class="material-symbols-outlined text-[16px] text-text-secondary" data-icon="upload">upload</span>
<span>Upload new image</span>
</button>
</div>
<span class="text-text-secondary font-small text-small text-[12px] leading-tight mt-0.5">JPG, PNG or GIF. Max 5MB</span>
</div>
</div>
<!-- Form Inputs -->
<form class="mt-6 space-y-4" onsubmit="event.preventDefault();">
<!-- Field 1: Display Name -->
<div>
<label class="block text-text-secondary font-small text-[11px] font-medium tracking-wider mb-2" for="display_name">FULL NAME / DISPLAY NAME</label>
<input class="w-full bg-background border border-border rounded-lg px-3.5 py-2.5 text-text-primary font-body-md text-small placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all duration-150" id="display_name" placeholder="Alex Morgan" type="text" value="Alex Morgan"/>
</div>
<!-- Field 2: Username -->
<div>
<label class="block text-text-secondary font-small text-[11px] font-medium tracking-wider mb-2" for="username">USERNAME</label>
<div class="relative flex items-center">
<span class="absolute left-3.5 text-text-secondary font-mono text-mono select-none">@</span>
<input class="w-full pl-8 pr-3.5 py-2.5 bg-background border border-border rounded-lg text-text-primary font-body-md text-small placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all duration-150 font-mono text-mono" id="username" placeholder="alexmorgan" type="text" value="alexmorgan"/>
</div>
</div>
<!-- Field 3: Status / Bio -->
<div>
<label class="block text-text-secondary font-small text-[11px] font-medium tracking-wider mb-2" for="bio">STATUS / BIO</label>
<textarea class="w-full bg-background border border-border rounded-lg px-3.5 py-2.5 text-text-primary font-body-md text-small placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-transparent transition-all duration-150 resize-none" id="bio" placeholder="Brief status or description (optional)" rows="2"></textarea>
</div>
<!-- Device Check Row (Minimal WebRTC Check) -->
<div class="bg-background border border-border rounded-lg p-3 flex items-center justify-between mt-5">
<div class="flex items-center gap-2.5">
<div class="flex items-center gap-1 text-text-secondary">
<span class="material-symbols-outlined text-[16px]" data-icon="videocam">videocam</span>
<span class="material-symbols-outlined text-[16px]" data-icon="mic">mic</span>
</div>
<div class="flex items-center gap-1.5">
<span class="w-1.5 h-1.5 rounded-full bg-success inline-block"></span>
<span class="text-text-primary font-small text-small font-medium">Camera &amp; microphone ready</span>
</div>
</div>
<button class="text-text-secondary hover:text-text-primary font-small text-small font-medium px-2 py-1 rounded hover:bg-surface border border-transparent hover:border-border transition-colors duration-150" type="button">
            Test
          </button>
</div>
<!-- Primary CTA Button -->
<div class="pt-2">
<button class="w-full bg-primary-container text-text-primary font-body-md text-small font-semibold rounded-lg py-3 flex items-center justify-center gap-2 hover:brightness-105 active:scale-[0.99] transition-all duration-150 shadow-sm cursor-pointer" type="submit">
<span>Complete Setup &amp; Open Chat</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary / Skip action -->
<a class="text-text-secondary hover:text-primary-container font-small text-small text-center block mt-4 transition-colors duration-150 font-medium" href="#">
            Skip this step for now
          </a>
</div>
</form>
</div>
</main>
<!-- Footer -->
<footer class="w-full text-center">
<p class="text-text-secondary font-small text-small tracking-wide select-none text-[13px]">
      Aether Secure Communication • Privacy &amp; Terms
    </p>
</footer>
</body></html>
