<body class="bg-background text-text-primary min-h-screen flex flex-col justify-between selection:bg-primary-container selection:text-white antialiased">
<!-- Header Anchor -->
<header class="w-full pt-8 pb-4 flex justify-center items-center">
<div class="inline-flex items-center gap-2 group cursor-pointer">
<div class="w-6 h-6 rounded-lg bg-surface border border-border flex items-center justify-center">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
</div>
<span class="font-h2 text-h2 text-text-primary font-bold tracking-tight">Aether</span>
</div>
</header>
<!-- Central Authentication Canvas -->
<main class="w-full flex-grow flex items-center justify-center px-4 py-8">
<div class="w-full max-w-[420px] bg-surface border border-border rounded-xl p-8 shadow-[0_4px_20px_rgba(0,0,0,0.3)] transition-all">
<!-- Card Heading -->
<div class="mb-6">
<h1 class="font-h2 text-h2 text-text-primary">Welcome back</h1>
<p class="font-small text-small text-text-secondary mt-1.5">Sign in to your account to continue</p>
</div>
<!-- Auth Form -->
<form class="space-y-4" onsubmit="event.preventDefault();">
<!-- Email Input Group -->
<div>
<label class="font-small text-small text-text-secondary block mb-2 font-medium tracking-wide" for="email">
            Email address
          </label>
<div class="relative">
<input autocomplete="email" class="w-full bg-background border border-border rounded-xl px-3.5 py-2.5 font-small text-small text-text-primary placeholder:text-text-secondary/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
</div>
</div>
<!-- Password Input Group -->
<div>
<div class="flex items-center justify-between mb-2">
<label class="font-small text-small text-text-secondary font-medium tracking-wide" for="password">
              Password
            </label>
<a class="font-small text-small text-primary-container hover:underline transition-all" href="#forgot">
              Forgot password?
            </a>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full bg-background border border-border rounded-xl px-3.5 py-2.5 pr-10 font-small text-small text-text-primary placeholder:text-text-secondary/50 focus:border-primary-container focus:ring-1 focus:ring-primary-container focus:outline-none transition-colors" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 text-text-secondary hover:text-text-primary transition-colors focus:outline-none flex items-center" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Controls: Remember Me -->
<div class="flex items-center pt-1">
<label class="relative flex items-center gap-2.5 cursor-pointer select-none">
<input class="w-4 h-4 rounded bg-background border-border text-primary-container focus:ring-primary-container focus:ring-offset-background focus:ring-offset-1 focus:ring-1 cursor-pointer transition-colors" name="remember" type="checkbox"/>
<span class="font-small text-small text-text-secondary">Remember me on this device</span>
</label>
</div>
<!-- Primary CTA -->
<button class="w-full mt-2 py-2.5 px-4 bg-primary-container hover:brightness-105 active:scale-[0.99] text-white font-small text-small font-semibold rounded-xl transition-all duration-150 ease-out shadow-sm flex items-center justify-center gap-2" type="submit">
<span>Sign In</span>
</button>
<!-- Divider -->
<div class="relative my-6 flex items-center justify-center">
<div class="w-full border-t border-border"></div>
<span class="absolute bg-surface px-3 font-small text-small text-text-secondary text-xs">
            or continue with
          </span>
</div>
<!-- SSO Options -->
<div class="grid grid-cols-2 gap-3">
<!-- Google SSO -->
<button class="flex items-center justify-center gap-2.5 py-2.5 px-3 bg-surface hover:bg-surface-variant/40 border border-border rounded-xl text-text-primary font-small text-small transition-colors duration-150 ease-out" type="button">
<svg class="w-4 h-4 flex-shrink-0" fill="currentColor" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span class="font-medium">Google</span>
</button>
<!-- GitHub SSO -->
<button class="flex items-center justify-center gap-2.5 py-2.5 px-3 bg-surface hover:bg-surface-variant/40 border border-border rounded-xl text-text-primary font-small text-small transition-colors duration-150 ease-out" type="button">
<svg class="w-4 h-4 text-text-primary flex-shrink-0" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>
</svg>
<span class="font-medium">GitHub</span>
</button>
</div>
</form>
<!-- Bottom Card Prompt -->
<div class="mt-6 pt-4 text-center border-t border-border/60">
<p class="font-small text-small text-text-secondary">
          Don't have an account? 
          <a class="text-primary-container font-medium hover:underline transition-all ml-1" href="#signup">
            Sign up
          </a>
</p>

</main>
<!-- Minimalist Footer -->
<footer class="w-full py-6 flex justify-center items-center">
<p class="font-small text-small text-text-secondary text-xs tracking-wide">
      Aether Secure Communication • Privacy &amp; Terms
    </p>
</footer>
<!-- Micro-interactions Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const togglePassword = document.getElementById('togglePassword');
      const passwordInput = document.getElementById('password');

      if (togglePassword && passwordInput) {
        togglePassword.addEventListener('click', () => {
          const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
          passwordInput.setAttribute('type', type);
          const iconSpan = togglePassword.querySelector('span');
          if (iconSpan) {
            iconSpan.textContent = type === 'password' ? 'visibility' : 'visibility_off';
          }
        });
      }
    });
  </script>
