<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Aether Chat - Verify Email</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-primary": "#003828",
            "on-primary-container": "#003224",
            "secondary": "#c4c6cd",
            "primary-container": "#00a67e",
            "surface": "#16191E",
            "inverse-surface": "#dce3f0",
            "on-tertiary-fixed-variant": "#45474a",
            "inverse-on-surface": "#2a313b",
            "primary": "#5bdcb0",
            "on-tertiary-container": "#292b2e",
            "on-tertiary": "#2f3034",
            "tertiary-fixed": "#e2e2e6",
            "surface-container": "#192029",
            "error-container": "#93000a",
            "surface-variant": "#2e353f",
            "surface-dim": "#0d141d",
            "on-tertiary-fixed": "#1a1c1f",
            "on-secondary-fixed": "#191c21",
            "tertiary-container": "#919296",
            "surface-container-lowest": "#080f17",
            "on-error-container": "#ffdad6",
            "primary-fixed-dim": "#5bdcb0",
            "secondary-container": "#44474d",
            "on-primary-fixed-variant": "#00513c",
            "on-background": "#dce3f0",
            "surface-container-high": "#232a34",
            "on-secondary-container": "#b3b5bc",
            "on-error": "#690005",
            "on-surface": "#dce3f0",
            "secondary-fixed": "#e1e2e9",
            "background": "#0D0F12",
            "outline-variant": "#3d4a43",
            "text-primary": "#F3F4F6",
            "tertiary-fixed-dim": "#c6c6ca",
            "on-secondary": "#2e3036",
            "outline": "#86948c",
            "secondary-fixed-dim": "#c4c6cd",
            "border": "#23272F",
            "surface-bright": "#333a44",
            "success": "#10B981",
            "on-surface-variant": "#bccac2",
            "on-primary-fixed": "#002116",
            "on-secondary-fixed-variant": "#44474d",
            "surface-container-highest": "#2e353f",
            "text-secondary": "#9CA3AF",
            "surface-container-low": "#151c25",
            "primary-fixed": "#7af9cc",
            "tertiary": "#c6c6ca",
            "surface-tint": "#5bdcb0",
            "error": "#EF4444",
            "inverse-primary": "#006c51"
          },
          "borderRadius": {
            "DEFAULT": "0.125rem",
            "lg": "0.25rem",
            "xl": "0.5rem",
            "full": "0.75rem"
          },
          "spacing": {
            "space-lg": "1.5rem",
            "space-sm": "0.5rem",
            "margin": "2rem",
            "gutter": "1.5rem",
            "space-xl": "2rem",
            "space-xs": "0.25rem",
            "space-md": "1rem"
          },
          "fontFamily": {
            "mono": ["JetBrains Mono"],
            "small": ["Inter"],
            "h2": ["Inter"],
            "body-md": ["Inter"],
            "h1": ["Inter"]
          },
          "fontSize": {
            "mono": ["0.875rem", { "fontWeight": "500" }],
            "small": ["0.875rem", { "lineHeight": "1.5", "fontWeight": "400" }],
            "h2": ["1.5rem", { "lineHeight": "1.3", "fontWeight": "600" }],
            "body-md": ["1rem", { "lineHeight": "1.6", "fontWeight": "400" }],
            "h1": ["2.25rem", { "lineHeight": "1.25", "fontWeight": "700" }]
          }
        },
      },
    }
  </script>
<style>
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .caret-blink {
      animation: blink 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-background text-text-primary min-h-screen flex flex-col justify-between items-center py-10 px-4 antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Branding Header -->
<header class="w-full flex justify-center items-center">
<div class="inline-flex items-center gap-2.5 bg-surface border border-border px-4 py-1.5 rounded-full shadow-sm">
<span class="w-2 h-2 rounded-full bg-primary-container"></span>
<span class="font-h2 text-small text-text-primary font-semibold tracking-tight">Aether</span>
</div>
</header>
<!-- Centered Auth Card Container -->
<main class="w-full max-w-[440px] my-auto">
<section class="bg-surface border border-border rounded-xl p-8 shadow-2xl transition-all">
<!-- Card Header -->
<div class="text-left">
<div class="inline-flex items-center justify-center w-10 h-10 rounded-lg bg-surface-container border border-border mb-4 text-primary">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<h1 class="font-h2 text-h2 text-text-primary tracking-tight font-bold">Check your email</h1>
<p class="font-small text-small text-text-secondary mt-2 leading-relaxed">
          We sent a 6-digit verification code to <span class="text-text-primary font-medium">alex@example.com</span>.
        </p>
</div>
<!-- OTP Entry Matrix -->
<div class="flex items-center justify-between gap-2.5 sm:gap-3 mt-7">
<!-- Slot 1: Filled -->
<div class="w-12 h-14 rounded-lg bg-background border border-border flex items-center justify-center font-mono text-2xl font-semibold text-text-primary">
          7
        </div>
<!-- Slot 2: Filled -->
<div class="w-12 h-14 rounded-lg bg-background border border-border flex items-center justify-center font-mono text-2xl font-semibold text-text-primary">
          2
        </div>
<!-- Slot 3: Filled -->
<div class="w-12 h-14 rounded-lg bg-background border border-border flex items-center justify-center font-mono text-2xl font-semibold text-text-primary">
          9
        </div>
<!-- Slot 4: Active / Focused with Animated Caret -->
<div class="w-12 h-14 rounded-lg bg-background border border-primary-container ring-2 ring-primary-container/30 flex items-center justify-center font-mono text-2xl font-semibold text-text-primary relative">
<span class="w-0.5 h-6 bg-primary-container caret-blink"></span>
</div>
<!-- Slot 5: Empty -->
<div class="w-12 h-14 rounded-lg bg-background border border-border flex items-center justify-center font-mono text-2xl font-semibold text-text-secondary/30">
          -
        </div>
<!-- Slot 6: Empty -->
<div class="w-12 h-14 rounded-lg bg-background border border-border flex items-center justify-center font-mono text-2xl font-semibold text-text-secondary/30">
          -
        </div>
</div>
<!-- Timer & Resend Row -->
<div class="flex items-center justify-center gap-2 mt-6">
<span class="font-small text-small text-text-secondary font-medium">
          Didn't receive the code?
        </span>
<div class="inline-flex items-center gap-1.5 font-small text-small text-text-secondary font-medium">
<span class="text-text-secondary">Resend in</span>
<span class="font-mono text-small text-primary font-medium tracking-tight">00:48</span>
</div>
</div>
<!-- Action Button -->
<button class="w-full mt-6 py-3 px-4 bg-primary-container hover:brightness-105 active:brightness-95 text-white font-small text-small font-semibold rounded-lg flex items-center justify-center gap-2 transition-all duration-150 ease-out shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2 focus:ring-offset-surface" type="button">
<span>Verify & Continue</span>
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
<!-- Secondary Email Change Action -->
<div class="mt-4 text-center">
<a class="inline-block font-small text-small text-text-secondary hover:text-primary transition-colors duration-150 ease-out font-medium focus:outline-none" href="#change-email">
          Use a different email address
        </a>
</div>
<!-- Security Guarantee Pill -->
<div class="mt-6 pt-5 border-t border-border flex items-center justify-center gap-2 text-text-secondary">
<span class="material-symbols-outlined text-[15px] text-primary" data-icon="lock">lock</span>
<span class="font-small text-small text-text-secondary">End-to-end encrypted protocol</span>
</div>
</section>
</main>
<!-- Screen Footer -->
<footer class="w-full flex justify-center items-center">
<p class="font-small text-small text-text-secondary text-center tracking-normal">
      Aether Secure Communication • Privacy & Terms
    </p>
</footer>
</body></html>
